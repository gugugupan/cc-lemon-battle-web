<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Loading">
<style>
.bar { transform-box: fill-box; transform-origin: 50% 50%; animation: pull 1.8s ease-in-out infinite; }
.stalk { transform-box: fill-box; transform-origin: 50% 0; animation: stalk 1.8s ease-in infinite; }
.drop { animation: drop 1.8s ease-in infinite; }
.d2 .stalk, .d2 .drop { animation-delay: 0.6s; }
.d3 .stalk, .d3 .drop { animation-delay: 1.2s; }
.splash { transform-box: fill-box; transform-origin: 50% 50%; animation: splash 1.8s ease-out infinite; }
.d2 .splash { animation-delay: 0.6s; }
.d3 .splash { animation-delay: 1.2s; }
@keyframes pull {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(0.95, 1.1); }
}
@keyframes stalk {
  0% { transform: scaleY(0); }
  45% { transform: scaleY(1); }
  58% { transform: scaleY(0.25); }
  100% { transform: scaleY(0); }
}
@keyframes drop {
  0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
  45% { transform: translate(0, 20px) scale(1); opacity: 1; }
  80% { transform: translate(0, 62px) scale(0.9, 1.1); opacity: 1; }
  81%, 100% { transform: translate(0, 62px) scale(0); opacity: 0; }
}
@keyframes splash {
  0%, 79% { transform: scale(0, 0); opacity: 0; }
  82% { transform: scale(0.6, 0.6); opacity: 1; }
  100% { transform: scale(1.4, 1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bar, .stalk, .drop, .splash { animation-duration: 3.6s; }
}
</style>
